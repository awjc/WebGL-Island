name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install timberborn-sim dependencies
        working-directory: timberborn-sim
        run: npm install

      - name: Build timberborn-sim
        working-directory: timberborn-sim
        run: npx vite build --base=/timberborn-sim/

      - name: Assemble deployment
        run: |
          mkdir deploy
          # Copy root site files (main WebGL Island)
          rsync -a --exclude='.git' --exclude='node_modules' \
            --exclude='timberborn-sim' --exclude='deploy' \
            --exclude='v[0-9]*' \
            . deploy/
          # Place built timberborn-sim at /timberborn-sim/
          mkdir deploy/timberborn-sim
          cp -r timberborn-sim/dist/. deploy/timberborn-sim/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
